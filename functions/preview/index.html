<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Whybee — Template Gallery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; background: #0b1020; color: #f5f5f5; }

      .top-bar {
        position: sticky; top: 0; z-index: 100;
        display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
        padding: 14px 24px;
        background: rgba(11,16,32,0.92); backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(148,163,184,0.15);
      }
      .top-bar h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; }
      .badge {
        display: inline-flex; align-items: center; gap: 5px;
        padding: 3px 9px; border-radius: 999px;
        border: 1px solid rgba(129,140,248,0.45);
        background: rgba(15,23,42,0.7);
        color: #c7d2fe; font-size: 11px; letter-spacing: 0.04em;
      }
      .badge-dot { width: 6px; height: 6px; border-radius: 999px; background: #4ade80; box-shadow: 0 0 0 3px rgba(74,222,128,0.2); }
      .spacer { flex: 1; }

      .actions { display: flex; gap: 6px; }
      .actions button {
        font: inherit; border: 1px solid rgba(148,163,184,0.3); border-radius: 8px;
        background: rgba(15,23,42,0.8); color: #e5e7eb; padding: 5px 12px; font-size: 11px;
        cursor: pointer; transition: all 0.15s;
      }
      .actions button:hover { border-color: rgba(129,140,248,0.8); background: rgba(99,102,241,0.15); color: #fff; }

      .grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 18px; padding: 20px 24px;
      }
      .card {
        border-radius: 14px; overflow: hidden;
        background: #0f172a;
        border: 1px solid rgba(148,163,184,0.2);
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
      }
      .card:hover { transform: translateY(-3px); box-shadow: 0 16px 40px rgba(0,0,0,0.55); }
      .card .preview { width: 100%; aspect-ratio: 210/297; background: #fff; display: flex; align-items: flex-start; justify-content: center; overflow: hidden; }
      .card canvas { width: 100%; height: auto; display: block; }
      .card .loading { padding: 40px; color: #555; font-size: 12px; text-align: center; }
      .card-footer {
        padding: 10px 14px; display: flex; align-items: center; justify-content: space-between;
      }
      .card-footer .name { font-weight: 600; font-size: 13px; }
      .card-footer .desc { font-size: 11px; color: #9ca3af; max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      .full-overlay {
        display: none; position: fixed; inset: 0; z-index: 200;
        background: rgba(0,0,0,0.88); backdrop-filter: blur(6px);
        flex-direction: column; align-items: center;
      }
      .full-overlay.open { display: flex; }
      .full-bar {
        width: 100%; padding: 12px 24px;
        display: flex; align-items: center; gap: 12px;
        background: rgba(15,23,42,0.95);
      }
      .full-bar .name { font-weight: 600; font-size: 15px; flex: 1; }
      .full-bar button {
        font: inherit; border: 1px solid rgba(148,163,184,0.3); border-radius: 8px;
        background: rgba(15,23,42,0.8); color: #e5e7eb; padding: 5px 14px; font-size: 12px;
        cursor: pointer; transition: all 0.14s;
      }
      .full-bar button:hover { border-color: rgba(129,140,248,0.8); color: #fff; }
      .full-bar button.primary { background: linear-gradient(135deg,#6366f1,#4f46e5); border-color: transparent; color: #fff; }
      .color-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .color-row span { font-size: 12px; color: #94a3b8; }
      .color-row .label-accent { font-weight: 600; color: #e2e8f0; margin-right: 6px; }
      .color-swatch {
        width: 36px; height: 36px; border-radius: 10px; border: 3px solid transparent;
        cursor: pointer; transition: transform 0.12s, box-shadow 0.12s;
      }
      .color-swatch:hover { transform: scale(1.15); box-shadow: 0 0 0 3px rgba(148,163,184,0.6); }
      .color-swatch.active { border-color: #fff; box-shadow: 0 0 0 3px #6366f1; }
      .gen-time { font-size: 11px; color: #64748b; margin-left: 8px; }
      .server-hint { font-size: 11px; color: #94a3b8; margin-left: 12px; }
      .full-canvas-wrap {
        flex: 1; overflow: auto; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 20px;
      }
      .full-canvas-wrap canvas { max-width: 680px; width: 100%; border-radius: 8px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
      .page-label { font-size: 11px; color: #999; margin-top: 6px; }
    </style>
  </head>
  <body>
    <div class="top-bar">
      <div class="badge"><span class="badge-dot"></span> Template Gallery</div>
      <h1>Whybee Template Gallery</h1>
      <span class="server-hint" id="server-hint">Open at <strong>http://localhost:4174</strong> for accent colors</span>
      <div class="spacer"></div>
      <div class="actions">
        <button onclick="copyCmd()">Copy rebuild command</button>
      </div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="full-overlay" id="overlay">
      <div class="full-bar">
        <span class="name" id="full-name"></span>
        <div class="color-row" id="color-row">
          <span class="label-accent">Accent color:</span>
          <div id="color-swatches"></div>
          <span class="gen-time" id="gen-time"></span>
        </div>
        <button onclick="nav(-1)">&#8592; Prev</button>
        <button onclick="nav(1)">Next &#8594;</button>
        <button class="primary" onclick="closeOverlay()">Close</button>
      </div>
      <div class="full-canvas-wrap" id="full-wrap"></div>
    </div>

    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      const TEMPLATES = [
        // Resumes
        { key: "astralis",        label: "Astralis",          desc: "Two-column, green accent, skill badges" },
        { key: "eclipse",         label: "Eclipse",           desc: "Clean single-column, centered serif name" },
        { key: "comet",           label: "Comet",             desc: "Yellow header band, black badge labels" },
        { key: "nebula",          label: "Nebula",            desc: "Navy header block, light sidebar" },
        { key: "cosmos",          label: "Cosmos",            desc: "Dark charcoal header, single-column" },
        { key: "celestial",       label: "Celestial",         desc: "Full-height navy sidebar, white main" },
        { key: "galaxy",          label: "Galaxy",            desc: "Formal serif, centered headings + rules" },
        { key: "astral",          label: "Astral",            desc: "Photo area, two-column, gold accent" },
        { key: "lunar",           label: "Lunar",             desc: "Boxed name, sidebar details, clean layout" },
        { key: "aurora",          label: "Aurora",            desc: "Pink/blush gradient, two-column body" },
        { key: "solstice",        label: "Solstice",          desc: "Ultra-minimal serif, no color" },
        { key: "ats",             label: "ATS",               desc: "Single-column, ATS-optimized parsing" },
        // Events
        { key: "event-invite",    label: "Event — Midnight",  desc: "Navy & gold, serif headline, elegant dots" },
        { key: "event-modern",    label: "Event — Modern",    desc: "Indigo left bar, pill rows, contemporary" },
        // Birthday
        { key: "birthday-invite", label: "Birthday — Bloom",  desc: "Pink florals, festive circles, warm tone" },
        { key: "birthday-golden", label: "Birthday — Golden", desc: "Cream double border, gold ornaments" },
        // Wedding
        { key: "wedding-ivory",   label: "Wedding — Ivory",   desc: "Ivory & gold, double border, romantic" },
        { key: "wedding-midnight",label: "Wedding — Midnight",desc: "Dark luxury, gold stripe, full-bleed" },
        // Engagement
        { key: "engagement-rose", label: "Engagement — Rose", desc: "Blush pink header, romantic script name" },
        // Party
        { key: "party-vivid",     label: "Party — Vivid",     desc: "Dark background, bold tri-color stripes" },
        // Business
        { key: "business-promo",  label: "Business — Impact", desc: "Navy header, teal CTA, bold impact layout" },
        { key: "business-clean",  label: "Business — Studio", desc: "White & teal, left accent bar, minimal" },
      ];

      let currentIdx = 0;
      let templateColors = {};
      let selectedColorByTemplate = {};
      const bust = Date.now();

      async function ensureTemplateColors() {
        if (Object.keys(templateColors).length > 0) return;
        try {
          const r = await fetch("/templates");
          if (r.ok) templateColors = await r.json();
        } catch (e) {}
      }
      fetch("/templates").then(r => r.ok ? r.json() : {}).then(c => {
        templateColors = c || {};
        const h = document.getElementById("server-hint");
        if (h) h.textContent = Object.keys(templateColors).length ? "Accent colors on — click a template, then pick a color" : "Open at http://localhost:4174 for accent colors";
      }).catch(() => {});

      async function renderPdfToCanvas(url, canvas, scale) {
        const pdf = await pdfjsLib.getDocument(url).promise;
        const page = await pdf.getPage(1);
        const vp = page.getViewport({ scale });
        canvas.width = vp.width;
        canvas.height = vp.height;
        await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
      }

      async function renderPdfBlobToCanvas(blob, canvas, scale) {
        const buf = await blob.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
        const page = await pdf.getPage(1);
        const vp = page.getViewport({ scale });
        canvas.width = vp.width;
        canvas.height = vp.height;
        await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
      }

      async function loadThumbnail(t, preview, canvas) {
        const colors = templateColors[t.key];
        if (colors && colors.length > 0) {
          try {
            const hex = (colors[0] || "").replace(/^#/, "");
            const r = await fetch(`/generate?template=${encodeURIComponent(t.key)}&color=${hex}&_=${Date.now()}`);
            if (r.ok) {
              const blob = await r.blob();
              await renderPdfBlobToCanvas(blob, canvas, 1.2);
              preview.innerHTML = "";
              preview.appendChild(canvas);
              return;
            }
          } catch (e) {}
        }
        try {
          await renderPdfToCanvas(`${t.key}.pdf?v=${bust}`, canvas, 1.2);
          preview.innerHTML = "";
          preview.appendChild(canvas);
        } catch (e) {
          preview.querySelector(".loading").textContent = "PDF not found — run rebuild command";
        }
      }

      async function buildGrid() {
        await ensureTemplateColors();
        const grid = document.getElementById("grid");
        grid.innerHTML = "";
        for (let i = 0; i < TEMPLATES.length; i++) {
          const t = TEMPLATES[i];
          const card = document.createElement("div");
          card.className = "card";
          card.onclick = () => openOverlay(i);
          const preview = document.createElement("div");
          preview.className = "preview";
          const loading = document.createElement("div");
          loading.className = "loading";
          loading.textContent = "Loading...";
          preview.appendChild(loading);
          card.appendChild(preview);

          const footer = document.createElement("div");
          footer.className = "card-footer";
          footer.innerHTML = `<span class="name">${t.label}</span><span class="desc">${t.desc}</span>`;
          card.appendChild(footer);
          grid.appendChild(card);

          const canvas = document.createElement("canvas");
          loadThumbnail(t, preview, canvas);
        }
      }

      async function loadPdfInOverlay(t, colorHex) {
        const wrap = document.getElementById("full-wrap");
        wrap.innerHTML = "<div style='color:#999;padding:40px'>Generating PDF...</div>";
        const colorParam = (colorHex || "").replace(/^#/, "");
        let pdfBlob;
        let timeMs = "";
        try {
          const r = await fetch(`/generate?template=${encodeURIComponent(t.key)}&color=${colorParam}&_=${Date.now()}`);
          if (!r.ok) throw new Error(await r.text());
          timeMs = r.headers.get("X-Generation-Time-Ms") || "";
          pdfBlob = await r.blob();
        } catch (e) {
          wrap.innerHTML = "<div style='color:#ef4442;padding:40px'>Failed to generate. Run the preview server: cd functions && npm run build && node lib/scripts/servePreview.js</div>";
          document.getElementById("gen-time").textContent = "";
          return;
        }
        document.getElementById("gen-time").textContent = timeMs ? `Generated in ${timeMs} ms` : "";
        const buf = await pdfBlob.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
        wrap.innerHTML = "";
        for (let p = 1; p <= pdf.numPages; p++) {
          const label = document.createElement("div");
          label.className = "page-label";
          label.textContent = `Page ${p} of ${pdf.numPages}`;
          wrap.appendChild(label);
          const canvas = document.createElement("canvas");
          const page = await pdf.getPage(p);
          const vp = page.getViewport({ scale: 2.5 });
          canvas.width = vp.width;
          canvas.height = vp.height;
          await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
          wrap.appendChild(canvas);
        }
      }

      function paintColorSwatches(t) {
        const colors = templateColors[t.key];
        const container = document.getElementById("color-swatches");
        const row = document.getElementById("color-row");
        row.style.display = "flex";
        if (!colors || colors.length === 0) {
          container.innerHTML = "<span class=\"server-hint\">Use http://localhost:4174 and run: npm run preview:serve</span>";
          document.getElementById("gen-time").textContent = "";
          return;
        }
        container.innerHTML = "";
        const selected = selectedColorByTemplate[t.key] || colors[0];
        colors.forEach(hex => {
          const swatch = document.createElement("button");
          swatch.type = "button";
          swatch.className = "color-swatch" + (hex === selected ? " active" : "");
          swatch.style.background = hex;
          swatch.title = hex;
          swatch.onclick = () => {
            selectedColorByTemplate[t.key] = hex;
            container.querySelectorAll(".color-swatch").forEach(s => s.classList.remove("active"));
            swatch.classList.add("active");
            loadPdfInOverlay(t, hex);
          };
          container.appendChild(swatch);
        });
      }

      async function openOverlay(idx) {
        currentIdx = idx;
        const t = TEMPLATES[idx];
        document.getElementById("full-name").textContent = `${t.label} — ${t.desc}`;
        await ensureTemplateColors();
        paintColorSwatches(t);
        document.getElementById("overlay").classList.add("open");
        const colors = templateColors[t.key];
        const color = colors && colors.length ? (selectedColorByTemplate[t.key] || colors[0]) : null;
        if (color) {
          await loadPdfInOverlay(t, color);
        } else {
          const wrap = document.getElementById("full-wrap");
          wrap.innerHTML = "<div style='color:#999;padding:40px'>Loading...</div>";
          try {
            const pdf = await pdfjsLib.getDocument(`${t.key}.pdf?v=${bust}`).promise;
            wrap.innerHTML = "";
            for (let p = 1; p <= pdf.numPages; p++) {
              const label = document.createElement("div");
              label.className = "page-label";
              label.textContent = `Page ${p} of ${pdf.numPages}`;
              wrap.appendChild(label);
              const canvas = document.createElement("canvas");
              const page = await pdf.getPage(p);
              const vp = page.getViewport({ scale: 2.5 });
              canvas.width = vp.width;
              canvas.height = vp.height;
              await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
              wrap.appendChild(canvas);
            }
          } catch (e) {
            wrap.innerHTML = "<div style='color:#ef4442;padding:40px'>PDF not found. Run: cd functions && node lib/scripts/servePreview.js then open http://localhost:4174</div>";
          }
          document.getElementById("gen-time").textContent = "";
        }
      }

      function closeOverlay() { document.getElementById("overlay").classList.remove("open"); }
      function nav(dir) { openOverlay((currentIdx + dir + TEMPLATES.length) % TEMPLATES.length); }

      function copyCmd() {
        const cmd = "cd functions && npm run build && npm run preview:resumes && npm run preview:invites && npm run preview:serve";
        navigator.clipboard.writeText(cmd).then(() => alert("Copied! Run in terminal, then open http://localhost:4174")).catch(() => prompt("Copy this:", cmd));
      }

      document.addEventListener("keydown", e => {
        if (!document.getElementById("overlay").classList.contains("open")) return;
        if (e.key === "Escape") closeOverlay();
        if (e.key === "ArrowLeft") nav(-1);
        if (e.key === "ArrowRight") nav(1);
      });

      buildGrid();
    </script>
  </body>
</html>
