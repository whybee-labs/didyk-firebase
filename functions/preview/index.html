<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Our Templates</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; font-family: "Quicksand", system-ui, sans-serif; background: #0b1020; color: #f5f5f5; }

      h1 {
        text-align: center; padding: 44px 0 30px;
        font-family: "Pacifico", cursive; font-size: 36px; font-weight: 400;
        background: linear-gradient(135deg, #a78bfa, #6366f1, #38bdf8);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .grid {
        display: grid; grid-template-columns: repeat(3, 1fr);
        gap: 24px; padding: 0 40px 40px; max-width: 1200px; margin: 0 auto;
      }
      .card {
        border-radius: 14px; overflow: hidden;
        background: #0f172a;
        border: 1px solid rgba(148,163,184,0.2);
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      }
      .card .preview {
        width: 100%; aspect-ratio: 210/297; background: #fff;
        display: flex; align-items: flex-start; justify-content: center; overflow: hidden;
      }
      .card canvas { width: 100%; height: auto; display: block; }
      .card .loading { padding: 40px; color: #555; font-size: 12px; text-align: center; }
      .card-name {
        text-align: center; padding: 12px 8px;
        font-family: "Quicksand", sans-serif; font-weight: 700; font-size: 16px;
        letter-spacing: 0.03em;
      }
    </style>
  </head>
  <body>
    <h1>Our Templates</h1>
    <div class="grid" id="grid"></div>

    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      const TEMPLATES = [
        { key: "mercury",  label: "Mercury" },
        { key: "venus",    label: "Venus" },
        { key: "earth",    label: "Earth" },
        { key: "mars",     label: "Mars" },
        { key: "jupiter",  label: "Jupiter" },
        { key: "saturn",   label: "Saturn" },
        { key: "uranus",   label: "Uranus" },
        { key: "neptune",  label: "Neptune" },
        { key: "pluto",    label: "Pluto" },
      ];

      let templateColors = {};
      const bust = Date.now();

      function getDefaultHex(key) {
        const c = templateColors[key];
        if (!c) return null;
        const colors = c.colors || (Array.isArray(c) ? c : []);
        if (colors.length === 0) return null;
        const first = colors[0];
        return (typeof first === "string" ? first : first.hex) || null;
      }

      async function loadThumbnail(t, preview, canvas) {
        const hex = getDefaultHex(t.key);
        if (hex) {
          try {
            const r = await fetch(`/generate?template=${encodeURIComponent(t.key)}&color=${hex.replace(/^#/,"")}&_=${Date.now()}`);
            if (r.ok) {
              const buf = await (await r.blob()).arrayBuffer();
              const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
              const page = await pdf.getPage(1);
              const vp = page.getViewport({ scale: 1.5 });
              canvas.width = vp.width; canvas.height = vp.height;
              await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
              preview.innerHTML = ""; preview.appendChild(canvas);
              return;
            }
          } catch (e) {}
        }
        try {
          const pdf = await pdfjsLib.getDocument(`${t.key}.pdf?v=${bust}`).promise;
          const page = await pdf.getPage(1);
          const vp = page.getViewport({ scale: 1.5 });
          canvas.width = vp.width; canvas.height = vp.height;
          await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
          preview.innerHTML = ""; preview.appendChild(canvas);
        } catch (e) {
          preview.querySelector(".loading").textContent = "PDF not found";
        }
      }

      async function buildGrid() {
        try {
          const r = await fetch("/templates");
          if (r.ok) templateColors = await r.json();
        } catch (e) {}

        const grid = document.getElementById("grid");
        grid.innerHTML = "";
        for (const t of TEMPLATES) {
          const card = document.createElement("div");
          card.className = "card";

          const preview = document.createElement("div");
          preview.className = "preview";
          const loading = document.createElement("div");
          loading.className = "loading";
          loading.textContent = "Loading...";
          preview.appendChild(loading);
          card.appendChild(preview);

          const name = document.createElement("div");
          name.className = "card-name";
          name.textContent = t.label;
          card.appendChild(name);
          grid.appendChild(card);

          const canvas = document.createElement("canvas");
          loadThumbnail(t, preview, canvas);
        }
      }

      buildGrid();
    </script>
  </body>
</html>
